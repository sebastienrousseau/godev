{{#extends "base"}}
{{#block "main"}}
<section id="hero" class="hero-section">
  <div class="container hero-container text-center">
    <div class="pill-badge">
      <span class="pill-tag">NEW</span>
      <span class="pill-text">v0.0.4 Unified Release · TMUX IDE · MCP Agent · Worktrees</span>
    </div>
    <h1 class="hero-title">{{headline}}</h1>
    <p class="hero-lead">{{lead}}</p>
    <div class="hero-cta-group">
      <a class="btn btn-primary btn-lg" href="#quickstart">Quick Start</a>
      <a class="btn btn-secondary btn-lg" href="https://github.com/sebastienrousseau/{{name}}" target="_blank" rel="noopener">Star on GitHub</a>
    </div>

    <!-- Authentic Code & Terminal IDE Preview -->
    <figure class="terminal-preview-card">
      <figcaption class="terminal-header">
        <div class="window-dots">
          <span class="dot dot-red" aria-hidden="true"></span>
          <span class="dot dot-yellow" aria-hidden="true"></span>
          <span class="dot dot-green" aria-hidden="true"></span>
        </div>
        <div class="terminal-tab-bar">
          <span class="tab-item active-tab font-mono">pkg/server/handler.go</span>
          <span class="tab-item font-mono">terminal</span>
        </div>
        <div class="terminal-actions">
          <span class="badge-status font-mono">● Go 1.24 + gopls + delve</span>
        </div>
      </figcaption>
      <div class="terminal-editor-pane">
        <pre class="editor-code font-mono"><code><span class="code-comment">// pkg/server/handler.go · Go 1.24 Generic Stream Handler</span>
<span class="code-kw">func</span> <span class="code-fn">HandleStream</span>[T <span class="code-type">any</span>](ctx <span class="code-type">context.Context</span>, in &lt;-<span class="code-kw">chan</span> T) (<span class="code-type">Stats</span>, <span class="code-type">error</span>) {
    <span class="code-kw">var</span> stats <span class="code-type">Stats</span>
    <span class="code-kw">for</span> {
        <span class="code-kw">select</span> {
        <span class="code-kw">case</span> &lt;-ctx.<span class="code-fn">Done</span>():
            <span class="code-kw">return</span> stats, fmt.<span class="code-fn">Errorf</span>(<span class="code-str">"stream cancelled: %w"</span>, ctx.<span class="code-fn">Err</span>())
        <span class="code-kw">case</span> val, ok := &lt;-in:
            <span class="code-kw">if</span> !ok { <span class="code-kw">return</span> stats, <span class="code-type">nil</span> }
            stats.<span class="code-fn">Process</span>(val)
        }
    }
}</code></pre>
      </div>
      <div class="terminal-cli-pane font-mono">
        <div class="cli-line"><span class="mcp-tl-ps">$ </span>go test -race -cover ./... &amp;&amp; golangci-lint run</div>
        <div class="cli-out">ok  github.com/sebastienrousseau/godev/pkg/server  0.18s  coverage: 100.0%</div>
        <div class="cli-line"><span class="mcp-tl-ask">&gt; </span>Claude MCP: Run delve debugging session on failed test case</div>
        <div class="cli-out cli-ok">✓ 0 data races · 0 lint errors · gopls LSP connected</div>
      </div>
    </figure>
  </div>
</section>

<!-- Content sections rendered from Markdown -->
<div class="content-sections">
  {{!content}}
</div>

{{/block}}
